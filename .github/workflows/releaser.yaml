name: goreleaser-pzero

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'

      - name: Get version
        id: get_version
        run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          registry: ghcr.io
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: ghcr.io/polpo-space/pzero:latest,ghcr.io/polpo-space/pzero:${{ steps.get_version.outputs.VERSION }}

  tag_cmd_pzero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
      - name: Get version
        id: get_version
        run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}
      - name: release pzero cmd
        run: |
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
  
          cd cmd/pzero
          GOWORK=off go mod edit -dropreplace github.com/polpo-space/pzero
          GOWORK=off go get github.com/polpo-space/pzero@${{ steps.get_version.outputs.VERSION }}
          GOWORK=off go mod tidy
          sed -i 's/version = ".*"/version = "${{ steps.get_version.outputs.VERSION }}"/g' main.go
          git add go.mod go.sum main.go
          git diff-index --quiet HEAD || git commit -m "chore(pzero): update pzero version"
          git push origin main
          git tag cmd/pzero/${{ steps.get_version.outputs.VERSION }}
          git push origin cmd/pzero/${{ steps.get_version.outputs.VERSION }}
