name: pzero-ci

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          cache-dependency-path: |
            go.sum
            cmd/pzero/go.sum

      - name: Install Tool
        run: go install ./cmd/pzero

      - name: format go
        run: pzero format -d --git-change=false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          skip-cache: true

      - name: Test core
        run: go test ./...

      - name: Test CLI
        working-directory: cmd/pzero
        run: go test ./...

      - name: Test RPC toolchain compatibility
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go build -o "$RUNNER_TEMP/goctl" github.com/zeromicro/go-zero/tools/goctl
          go install google.golang.org/protobuf/cmd/protoc-gen-go
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          GOCTL="$RUNNER_TEMP/goctl" go test ./cmd/pzero/internal/command/gen/genrpc -run TestGoctlCrossProtoServices -count=1
