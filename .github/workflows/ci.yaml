name: pzero-ci

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pzero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pzero_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          cache-dependency-path: |
            go.sum
            cmd/pzero/go.sum

      - name: Install Tool
        run: go install ./cmd/pzero

      - name: format go
        run: pzero format -d --git-change=false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          skip-cache: true

      - name: Test core
        run: go test ./...

      - name: Test CLI
        working-directory: cmd/pzero
        run: go test ./...

      - name: Build pinned goctl
        run: go build -o "$RUNNER_TEMP/goctl" github.com/zeromicro/go-zero/tools/goctl

      - name: Test PostgreSQL generated models
        env:
          PZERO_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/pzero_test?sslmode=disable
        run: GOCTL="$RUNNER_TEMP/goctl" go test ./cmd/pzero/internal/command/gen/genmodel -run TestPostgresGeneratedModels -count=1 -v

      - name: Test RPC toolchain compatibility
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          GOCTL="$RUNNER_TEMP/goctl" go test ./cmd/pzero/internal/command/gen/genrpc -run TestGoctlCrossProtoServices -count=1
