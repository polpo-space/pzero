version: "2"
run:
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - thelper
    - tparallel
    - unconvert
    - unused
    - wastedassign
    - whitespace
formatters:
  # pzero format checks imports using each file's go.mod in this workspace.
  enable:
    - gofmt
    - gofumpt
