syntax = "proto3";

package pzero.api;

option go_package = "github.com/polpo-space/pzero/proto/api";

import "google/protobuf/descriptor.proto";

extend google.protobuf.MethodOptions {
  HttpRule http = 10000;
}

extend google.protobuf.ServiceOptions {
  HttpRule http_group = 10001;
}

message HttpRule {
  string middleware = 1;
}
